name: chatkeeper

# Прод-стек chatkeeper. Самодостаточен: свой бот + своя база.
# Caddy НЕ входит сюда — им занимается отдельный проект edge.
#
# Требуется общая сеть edge (один раз на сервер): docker network create web
#
# Запуск:
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal          # только для связи с ботом, наружу не видна
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      web:
        # По этому имени edge (Caddy) обращается к боту.
        aliases:
          - chatkeeper

networks:
  internal: {}
  # Общая сеть edge. Создаётся вручную: docker network create web
  web:
    external: true

volumes:
  pgdata: {}
  media: {}
